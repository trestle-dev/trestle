<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trestle incident tracker</title><style>
:root{color-scheme:dark;--bg:#1f2021;--surface:#292b2c;--line:#3a3c3d;--text:#f2f3f2;--muted:#b8bdb9;--accent:#81c995;font:15px/1.5 system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}header,main{max-width:1050px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}header strong,.eyebrow{color:var(--accent)}.panel,.incident{padding:18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}form{display:grid;gap:10px}.login{max-width:420px;margin:8vh auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:340px 1fr;gap:16px;margin-top:18px}.list{display:grid;gap:10px}.incident{width:100%;text-align:left;color:var(--text)}.incident:hover{border-color:var(--accent)}label{display:grid;gap:4px;color:var(--muted)}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text)}textarea{min-height:110px;resize:vertical}button{padding:10px 14px;border:1px solid var(--line);border-radius:7px;background:#303331;color:var(--text)}button.primary{background:var(--accent);color:#152018;font-weight:700}.meta{color:var(--muted);font-size:.9rem}.timeline{display:grid;gap:8px;margin-top:18px}.timeline article{padding-left:12px;border-left:2px solid var(--accent)}[hidden]{display:none!important}@media(max-width:760px){.grid{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}}
</style></head><body><header><div><strong>Trestle</strong> / Incident desk</div><span id="live" class="meta">Offline</span></header><main><form id="login" class="panel login"><p class="eyebrow">Application user</p><h1>Incident desk</h1><label>Email<input name="email" type="email" value="reporter@example.com" required></label><label>Password<input name="password" type="password" value="reporter7" minlength="7" required></label><button class="primary">Sign in</button><p class="error"></p></form><section id="desk" hidden><div class="toolbar"><div><p class="eyebrow">Operations</p><h1>Active incidents</h1></div><button id="logout">Log out</button></div><div class="grid"><div><form id="create" class="panel"><h2>Declare incident</h2><label>Title<input name="title" required></label><label>Severity<select name="severity"><option>sev1</option><option selected>sev2</option><option>sev3</option></select></label><label>Summary<textarea name="summary" required></textarea></label><button class="primary">Create incident</button><p class="error"></p></form><div id="incidents" class="list"></div></div><section id="detail" class="panel"><h2>Select an incident</h2><p class="meta">Updates will appear here. Realtime changes refresh the list without a page navigation.</p></section></div></section></main><script>
let accessToken="",refreshToken="",userId="",selected="";const login=document.querySelector('#login'),desk=document.querySelector('#desk'),list=document.querySelector('#incidents'),detail=document.querySelector('#detail');async function request(path,options={}){const response=await fetch(path,{...options,headers:{Accept:'application/json','Content-Type':'application/json',...(accessToken?{Authorization:`Bearer ${accessToken}`}:{ }),...(options.headers||{})}});const body=response.status===204?null:await response.json();if(!response.ok)throw new Error(body?.error?.message||`Request failed (${response.status})`);return body}login.addEventListener('submit',async event=>{event.preventDefault();try{const result=await request('/api/v1/auth/login',{method:'POST',body:JSON.stringify({email:event.currentTarget.email.value,password:event.currentTarget.password.value})});accessToken=result.accessToken;refreshToken=result.refreshToken;userId=result.userId;login.hidden=true;desk.hidden=false;await loadIncidents();stream()}catch(error){login.querySelector('.error').textContent=error.message}});document.querySelector('#create').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget;try{const created=await request('/api/v1/collections/incidents/records',{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({values:{title:form.title.value,severity:form.severity.value,status:'open',summary:form.summary.value,reporter_id:userId}})});form.reset();selected=created.id;await loadIncidents()}catch(error){form.querySelector('.error').textContent=error.message}});document.querySelector('#logout').addEventListener('click',async()=>{await request('/api/v1/auth/logout',{method:'POST',body:JSON.stringify({refreshToken})});location.reload()});async function loadIncidents(){const result=await request('/api/v1/collections/incidents/records?sort=-createdAt&limit=100');list.innerHTML=result.items.map(item=>`<button class="incident" data-id="${item.id}"><strong>${escapeHTML(item.values.title)}</strong><div class="meta">${item.values.severity} · ${item.values.status}</div></button>`).join('')||'<p class="meta">No incidents yet.</p>';list.querySelectorAll('[data-id]').forEach(button=>button.onclick=()=>showIncident(result.items.find(item=>item.id===button.dataset.id)));if(selected){const item=result.items.find(item=>item.id===selected);if(item)showIncident(item)}}async function showIncident(item){selected=item.id;const updates=await request(`/api/v1/collections/updates/records?filter=${encodeURIComponent(`incident_id == "${item.id}"`)}&sort=createdAt&limit=100`);detail.innerHTML=`<p class="eyebrow">${escapeHTML(item.values.severity)}</p><h2>${escapeHTML(item.values.title)}</h2><p>${escapeHTML(item.values.summary)}</p><p class="meta">Status: ${escapeHTML(item.values.status)} · version ${item.version}</p><form id="update"><label>Timeline update<textarea name="message" required></textarea></label><button>Add update</button></form><div class="timeline">${updates.items.map(update=>`<article><strong>${escapeHTML(update.values.kind)}</strong><p>${escapeHTML(update.values.message)}</p></article>`).join('')}</div>`;detail.querySelector('#update').onsubmit=async event=>{event.preventDefault();await request('/api/v1/collections/updates/records',{method:'POST',body:JSON.stringify({values:{incident_id:item.id,author_id:userId,kind:'note',message:event.currentTarget.message.value}})});showIncident(item)}}async function stream(){document.querySelector('#live').textContent='Realtime connecting';const response=await fetch('/api/v1/realtime',{headers:{Authorization:`Bearer ${accessToken}`}});if(!response.ok){document.querySelector('#live').textContent='Realtime unavailable';return}document.querySelector('#live').textContent='Realtime connected';const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const events=buffer.split('\n\n');buffer=events.pop();for(const event of events)if(event.includes('event: record.'))loadIncidents()}}function escapeHTML(value){return String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
</script></body></html>

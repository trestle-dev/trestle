<!doctype html>
<html lang="en">
	<head>
		@input("templates/head.html")
	</head>
	<body>
		<section id="auth-gate" class="auth-gate" aria-labelledby="auth-title"><form id="auth-form"><div class="brand auth-brand"><span>T</span> Trestle</div><p id="auth-kicker" class="eyebrow">Secure administration</p><h1 id="auth-title">Checking setup…</h1><p id="auth-description">Trestle is checking whether this deployment needs its first administrator.</p><fieldset id="database-preview" hidden disabled><legend>Database</legend><label class="database-choice"><input type="radio" name="database-provider" value="sqlite" checked><span><strong>SQLite</strong><small>Recommended. Local and zero configuration.</small></span></label><label class="database-choice"><input type="radio" name="database-provider" value="postgres"><span><strong>PostgreSQL</strong><small>Configuration preview; activation arrives with dual migrations.</small></span></label></fieldset><label>Email<input id="auth-email" name="email" type="email" autocomplete="username" required></label><label>Password<input id="auth-password" name="password" type="password" minlength="7" autocomplete="current-password" required></label><p id="auth-error" class="auth-error" role="alert"></p><button id="auth-submit" type="submit">Continue</button></form></section>
		@content
		<script src="/assets/js/script.js" defer></script>
	</body>
</html>

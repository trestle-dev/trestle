name: Release rehearsal (manual)

# Manually dispatched, fresh GitHub-hosted Ubuntu runner rehearsal of a public
# vX.Y.Z-rc.N release. It never checks out the repository, never uses local
# build outputs, never tags/publishes/promotes/edits a release and never writes
# repository contents: everything is downloaded from the public GitHub release
# and https://trestle.cv, and permissions are read-only.
#
# The accepted version format is deliberately narrowed to release candidates:
#   vMAJOR.MINOR.PATCH-rc.POSITIVE_INTEGER   (example: v0.1.0-rc.1)
# Stable tags, missing/zero/leading-zero RC numbers, repeated/trailing dots,
# build metadata, whitespace, control characters and shell metacharacters are
# rejected. The untrusted input is passed through the step environment and
# never interpolated into shell source.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact RC tag to rehearse (e.g. v0.1.0-rc.1)'
        required: true

permissions:
  contents: read
  attestations: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=$INPUT_VERSION
          case "$version" in
            v[0-9]*.[0-9]*.[0-9]*-rc\.[1-9]*) ;;
            *) echo "invalid version '$version': expected vMAJOR.MINOR.PATCH-rc.POSITIVE_INTEGER (e.g. v0.1.0-rc.1)" >&2; exit 1 ;;
          esac
          if printf '%s' "$version" | LC_ALL=C grep -q '[^ -~]' \
            || [ "$(printf '%s' "$version" | wc -l)" -gt 0 ]; then
            echo "invalid version '$version': contains a control, newline or non-ASCII character" >&2; exit 1
          fi
          printf '%s\n' "$version" | LC_ALL=C grep -q '^v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*-rc\.[1-9][0-9]*$' \
            || { echo "invalid version '$version': not an exact vMAJOR.MINOR.PATCH-rc.N value" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Select the rehearsal repository identity
        run: |
          set -euo pipefail
          # Fail-closed legacy mapping: v0.1.0-rc.1 was published under the
          # former github.com/trestle-dev/trestle identity. Everything after the
          # v0.1.3 migration must rehearse against the canonical trestle-cv.
          # No caller-controlled repository or signer identity is accepted.
          case "$INPUT_VERSION" in
            v0.1.0-rc.1)
              echo "VERIFY_REPO=trestle-dev/trestle" >> "$GITHUB_ENV"
              echo "identity: legacy trestle-dev/trestle ($INPUT_VERSION)"
              ;;
            *)
              echo "VERIFY_REPO=trestle-cv/trestle" >> "$GITHUB_ENV"
              echo "identity: canonical trestle-cv/trestle ($INPUT_VERSION)"
              ;;
          esac
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Resolve tag to commit
        run: |
          set -euo pipefail
          # Peel the selected tag to its commit via the GitHub API (handles
          # annotated and lightweight tags without checking out the repository).
          expected_commit=$(curl -fsSL --max-time 30 \
            "https://api.github.com/repos/${VERIFY_REPO}/commits/${version}" | jq -r '.sha')
          printf '%s\n' "$expected_commit" | LC_ALL=C grep -q '^[0-9a-f]\{40\}$' \
            || { echo "could not resolve tag ${version} to a commit (got '$expected_commit')" >&2; exit 1; }
          echo "expected_commit=$expected_commit" >> "$GITHUB_ENV"
          echo "resolved ${version} -> $expected_commit"

      - name: Inspect the installed gh CLI contract
        run: |
          set -euo pipefail
          gh version
          echo "--- gh attestation verify --help ---"
          gh attestation verify --help
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download public release assets
        run: |
          set -euo pipefail
          mkdir -p artifacts
          base="https://github.com/${VERIFY_REPO}/releases/download/${version}"
          curl -fsSL --max-time 60 -o artifacts/SHA256SUMS "$base/SHA256SUMS"
          for a in \
            "trestle_${version#v}_linux_amd64.tar.gz" \
            "trestle_${version#v}_linux_arm64.tar.gz" \
            "trestle_${version#v}_darwin_amd64.tar.gz" \
            "trestle_${version#v}_darwin_arm64.tar.gz" \
            "trestle_${version#v}_windows_amd64.zip" \
            "trestle_${version#v}_windows_arm64.zip"; do
            curl -fsSL --max-time 120 -o "artifacts/$a" "$base/$a"
          done
          echo "downloaded SHA256SUMS + six archives for ${version}"

      - name: Verify checksums and exact asset set
        run: |
          set -euo pipefail
          cd artifacts
          n=$(find . -maxdepth 1 -name 'trestle_*' | wc -l)
          [ "$n" -eq 6 ] || { echo "expected exactly six archives, found $n" >&2; exit 1; }
          sha256sum -c SHA256SUMS

      - name: Verify build provenance and record details
        run: |
          set -euo pipefail
          cd artifacts
          # Diagnostic-only reporting. The authoritative provenance gate is the
          # gh command itself and its exit status; the jq below merely requires
          # a non-empty array of verificationResult objects and prints whatever
          # certificate structure the installed CLI actually supplied (no
          # guessed field names, no additional schema contract).
          validate_json='
            type == "array" and length > 0 and all(.[]; (.verificationResult | type) == "object")
          '
          report_json='
            .[] |
            .verificationResult as $r |
            "subjects: " + (($r.statement.subject // []) | map(.name // "<unnamed>") | join(",")),
            "certificate: " + (($r.signature.certificate // {}) | tojson),
            "verifiedTimestamps: " + (($r.verifiedTimestamps // []) | length | tostring)
          '
          for a in trestle_*; do
            echo "=== gh attestation verify: $a ==="
            json=$(gh attestation verify "$a" \
              --repo "${VERIFY_REPO}" \
              --signer-workflow "${VERIFY_REPO}/.github/workflows/release.yml" \
              --source-ref "refs/tags/${version}" \
              --source-digest "${expected_commit}" \
              --deny-self-hosted-runners \
              --format json)
            printf '%s' "$json" | jq -e "$validate_json" >/dev/null
            printf '%s' "$json" | jq -r "$report_json"
            echo "=== $a: attestation VERIFIED against the pinned release workflow @ ${version} ==="
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Exercise public release on the fresh runner
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          svc=""
          cleanup() {
            if [ -n "$svc" ]; then
              if kill -0 "$svc" 2>/dev/null; then
                kill "$svc" 2>/dev/null || true
              fi
              wait "$svc" 2>/dev/null || true
              svc=""
            fi
            rm -rf "$work"
          }
          trap cleanup EXIT
          trap 'cleanup; exit 130' INT
          trap 'cleanup; exit 143' TERM
          cd "$work"

          echo "--- 1. pinned download.sh (public URL) ---"
          curl -fsSL --max-time 60 https://trestle.cv/download.sh -o download.sh
          sh download.sh --version "${version}" >/dev/null
          [ -x ./trestle ] || { echo "download produced no executable" >&2; exit 1; }
          leftovers="$(ls -A1 | grep -v '^download.sh$' | grep -v '^trestle$' || true)"
          [ -z "$leftovers" ] || { echo "download wrote unexpected files: $leftovers" >&2; exit 1; }
          vout="$(./trestle version)"
          echo "$vout" | grep -q "\"version\":\"${version#v}\"" || { echo "version mismatch: $vout" >&2; exit 1; }
          echo "$vout" | grep -q "\"commit\":\"${expected_commit}\"" || { echo "commit mismatch (want ${expected_commit}): $vout" >&2; exit 1; }
          echo "$vout" | grep -q '"os":"linux"' || { echo "os mismatch: $vout" >&2; exit 1; }
          echo "$vout" | grep -q '"arch":"amd64"' || { echo "arch mismatch: $vout" >&2; exit 1; }
          echo "download.sh: OK (version=${version#v}, commit=${expected_commit}, linux/amd64)"

          echo "--- 2. pinned install.sh with isolated HOME ---"
          curl -fsSL --max-time 60 https://trestle.cv/install.sh -o install.sh
          mkdir -p "$work/home"
          HOME="$work/home" sh install.sh --version "${version}" >/dev/null
          installed="$work/home/.local/bin/trestle"
          [ -x "$installed" ] || { echo "install produced no executable" >&2; exit 1; }
          mode="$(stat -c '%a' "$installed")"
          [ "$mode" = "755" ] || { echo "installed mode is $mode, want 755" >&2; exit 1; }
          echo "install.sh: OK ($installed, mode $mode)"

          echo "--- 3. SQLite first-run journey (public binary) ---"
          port=$(( 29000 + ($$ % 10000) ))
          base="http://127.0.0.1:$port"
          "$installed" --listen "127.0.0.1:$port" --data-dir "$work/data" > server.log 2>&1 &
          svc=$!
          i=0
          until curl -fsS --max-time 2 "$base/system/health" >/dev/null 2>&1; do
            i=$((i+1)); [ "$i" -ge 50 ] && { cat server.log >&2; exit 1; }; sleep 0.2
          done
          echo "health: $(curl -fsS --max-time 3 "$base/system/health")"
          echo "ready: $(curl -fsS --max-time 3 "$base/system/ready")"
          [ "$(curl -fsS --max-time 3 "$base/admin/v1/setup/status")" = '{"setupRequired":true}' ] || { echo "setupRequired unexpected" >&2; exit 1; }
          # Six-character password rejected; exactly seven-character accepted.
          reject=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' -X POST "$base/admin/v1/setup" \
            -H 'Content-Type: application/json' -H "Origin: $base" -d '{"email":"a@example.com","password":"123456"}')
          [ "$reject" = "422" ] || { echo "six-char password not rejected (status $reject)" >&2; exit 1; }
          pw="1234567"
          curl -fsS --max-time 5 -c cj -X POST "$base/admin/v1/setup" \
            -H 'Content-Type: application/json' -H "Origin: $base" \
            -d "{\"email\":\"admin@example.com\",\"password\":\"$pw\"}" > setup.json
          csrf() { curl -fsS --max-time 3 -b cj "$base/admin/v1/session" | sed -E 's/.*"csrfToken":"([^"]+)".*/\1/' | tr -d '\r\n'; }
          curl -fsS --max-time 3 -b cj "$base/admin/v1/session" | grep -q '"authenticated":true' || { echo "not authenticated after setup" >&2; exit 1; }
          CSRF=$(csrf)
          cc=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' -b cj -X POST "$base/admin/v1/collections" \
            -H 'Content-Type: application/json' -H "Origin: $base" -H "X-Trestle-CSRF: $CSRF" \
            -d '{"name":"notes","fields":[{"name":"title","type":"text","required":true}]}')
          [ "$cc" = "201" ] || { echo "collection create status $cc" >&2; exit 1; }
          CSRF=$(csrf)
          rw=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' -b cj -X POST "$base/api/v1/collections/notes/records" \
            -H 'Content-Type: application/json' -H "Origin: $base" -H "X-Trestle-CSRF: $CSRF" \
            -d '{"values":{"title":"rehearsal note"}}')
          [ "$rw" = "201" ] || { echo "record create status $rw" >&2; exit 1; }
          curl -fsS --max-time 5 -b cj "$base/api/v1/collections/notes/records?limit=25" | grep -q '"rehearsal note"' || { echo "record not retrievable" >&2; exit 1; }
          echo "first-run journey: OK (7-char password setup/collection/record)"
          kill "$svc" 2>/dev/null || true; wait "$svc" 2>/dev/null || true; svc=""

          echo "--- restart persistence ---"
          "$installed" --listen "127.0.0.1:$port" --data-dir "$work/data" >> server.log 2>&1 &
          svc=$!
          i=0
          until curl -fsS --max-time 2 "$base/system/health" >/dev/null 2>&1; do
            i=$((i+1)); [ "$i" -ge 50 ] && { cat server.log >&2; exit 1; }; sleep 0.2
          done
          curl -fsS --max-time 5 -c cj -X POST "$base/admin/v1/session" \
            -H 'Content-Type: application/json' -H "Origin: $base" \
            -d "{\"email\":\"admin@example.com\",\"password\":\"$pw\"}" >/dev/null
          curl -fsS --max-time 5 -b cj "$base/api/v1/collections/notes/records?limit=25" | grep -q '"rehearsal note"' \
            || { echo "record lost across restart" >&2; exit 1; }
          echo "restart persistence: OK"
          kill "$svc" 2>/dev/null || true; wait "$svc" 2>/dev/null || true; svc=""
          echo "=== REHEARSAL COMPLETE (fresh GitHub-hosted Ubuntu runner) ==="
        env:
          GH_TOKEN: ${{ github.token }}
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        run: |
          go test ./...
          go vet ./...
          node --check internal/web/public/assets/js/script.js
          node scripts/check-web.mjs internal/web/public
      - name: Package six targets
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME#v}" dist
      - name: Write release notes
        run: sed "s/{{VERSION}}/${GITHUB_REF_NAME#v}/" docs/release-notes-template.md > release-body.md
      - name: Validate release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -s release-body.md ] || { echo "release body is empty" >&2; exit 1; }
          grep -q "{{VERSION}}" release-body.md && { echo "unresolved {{VERSION}} placeholder" >&2; exit 1; } || true
          echo "$version" | grep -q . && grep -q "$version" release-body.md || { echo "expected version missing" >&2; exit 1; }
          for heading in "preview / release candidate" PostgreSQL SQLite "Operator responsibilities" "Back up before upgrading" "Known limitations" "Verified installation"; do
            grep -qi "$heading" release-body.md || { echo "release body lacks: $heading" >&2; exit 1; }
          done
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-body.md
          generate_release_notes: true

name: Release

on:
  push:
    tags: ['v*']

# Privilege is minimized: the build job runs read-only, the attestation job
# holds only OIDC/attestation permissions, and only the publication job holds
# contents: write. Every action is pinned to a reviewed full commit SHA (with
# the human-readable version in a trailing comment); the release-contract
# regression (scripts/test-release-contract.sh) rejects any mutable tag here.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        run: |
          go test ./...
          go vet ./...
          node --check internal/web/public/assets/js/script.js
          node scripts/check-web.mjs internal/web/public
      - name: Package six targets
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME#v}" dist
      - name: Write release notes
        run: sed "s/{{VERSION}}/${GITHUB_REF_NAME#v}/" docs/release-notes-template.md > release-body.md
      - name: Validate release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -s release-body.md ] || { echo "release body is empty" >&2; exit 1; }
          grep -q "{{VERSION}}" release-body.md && { echo "unresolved {{VERSION}} placeholder" >&2; exit 1; } || true
          echo "$version" | grep -q . && grep -q "$version" release-body.md || { echo "expected version missing" >&2; exit 1; }
          for heading in "preview / release candidate" PostgreSQL SQLite "Operator responsibilities" "Back up before upgrading" "Known limitations" "Verified installation"; do
            grep -qi "$heading" release-body.md || { echo "release body lacks: $heading" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/*
            release-body.md

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: .
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

  publish:
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: .
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: release-body.md
          generate_release_notes: true
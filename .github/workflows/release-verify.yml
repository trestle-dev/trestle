name: Release verify (read-only)

# Manual, read-only verification of a published Trestle release on a fresh
# GitHub-hosted runner. It queries the real GitHub release asset set, verifies
# every checksum, runs the constrained `gh attestation verify` on every
# archive, and checks that the live release body wording matches the release
# kind. It never edits the release body, moves or recreates the tag, or mutates
# assets. It is deliberately manual-only and read-only; the one-off in-place
# body correction for v0.1.0 was already applied and is recorded in the ledger.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to verify (e.g. v0.1.0 or v0.1.0-rc.1)'
        required: true

permissions:
  contents: read
  attestations: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag
        env:
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          release=$INPUT_RELEASE
          case "$release" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid release tag '$release': expected vMAJOR.MINOR.PATCH[-suffix]" >&2; exit 1 ;;
          esac
          if printf '%s' "$release" | LC_ALL=C grep -q '[^ -~]'; then
            echo "invalid characters in release tag '$release'" >&2; exit 1
          fi
          printf '%s\n' "$release" | LC_ALL=C grep -q '^v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\(-[0-9A-Za-z][0-9A-Za-z.]*\)\?$' \
            || { echo "invalid release tag '$release'" >&2; exit 1; }
          echo "release=$release" >> "$GITHUB_ENV"

      - name: Select the verification repository identity
        run: |
          set -euo pipefail
          # Fail-closed legacy mapping: releases through v0.1.2 were published
          # under the former github.com/trestle-dev/trestle identity, so their
          # attestations are bound to that signer. Everything after the v0.1.3
          # migration must verify against the canonical trestle-cv/trestle.
          # No caller-controlled repository or signer identity is accepted.
          case "$INPUT_RELEASE" in
            v0.1.0|v0.1.1|v0.1.2|v0.1.0-rc.1)
              echo "VERIFY_REPO=trestle-dev/trestle" >> "$GITHUB_ENV"
              echo "identity: legacy trestle-dev/trestle ($INPUT_RELEASE)"
              ;;
            *)
              echo "VERIFY_REPO=trestle-cv/trestle" >> "$GITHUB_ENV"
              echo "identity: canonical trestle-cv/trestle ($INPUT_RELEASE)"
              ;;
          esac
        env:
          INPUT_RELEASE: ${{ inputs.release }}

      - name: Resolve the release tag to its commit
        run: |
          set -euo pipefail
          commit=$(curl -fsSL --max-time 30 "https://api.github.com/repos/${VERIFY_REPO}/commits/${release}" | jq -r '.sha')
          printf '%s\n' "$commit" | LC_ALL=C grep -q '^[0-9a-f]\{40\}$' \
            || { echo "could not resolve ${release} to a commit" >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_ENV"
          echo "resolved ${release} -> $commit"

      - name: Verify the public release asset set
        run: |
          set -euo pipefail
          { printf '%s\n' SHA256SUMS; for a in \
              "trestle_${release#v}_darwin_amd64.tar.gz" \
              "trestle_${release#v}_darwin_arm64.tar.gz" \
              "trestle_${release#v}_linux_amd64.tar.gz" \
              "trestle_${release#v}_linux_arm64.tar.gz" \
              "trestle_${release#v}_windows_amd64.zip" \
              "trestle_${release#v}_windows_arm64.zip"; do printf '%s\n' "$a"; done; } | LC_ALL=C sort > expected.txt
          actual=$(gh api "repos/${VERIFY_REPO}/releases/tags/${release}" --jq '.assets[].name' | LC_ALL=C sort)
          if ! diff -u expected.txt <(printf '%s\n' "$actual"); then
            echo "release asset set does not match the expected set" >&2
            exit 1
          fi
          echo "public asset set matches exactly:"
          cat expected.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download the public assets
        run: |
          set -euo pipefail
          mkdir -p artifacts
          base="https://github.com/${VERIFY_REPO}/releases/download/${release}"
          for a in \
            SHA256SUMS \
            "trestle_${release#v}_linux_amd64.tar.gz" \
            "trestle_${release#v}_linux_arm64.tar.gz" \
            "trestle_${release#v}_darwin_amd64.tar.gz" \
            "trestle_${release#v}_darwin_arm64.tar.gz" \
            "trestle_${release#v}_windows_amd64.zip" \
            "trestle_${release#v}_windows_arm64.zip"; do
            curl -fsSL --max-time 120 -o "artifacts/$a" "$base/$a"
          done

      - name: Validate SHA256SUMS entries and verify every checksum
        run: |
          set -euo pipefail
          cd artifacts
          [ "$(wc -l < SHA256SUMS)" -eq 6 ] || { echo "SHA256SUMS must contain exactly six entries" >&2; exit 1; }
          python3 - "${release#v}" <<'PY'
          import sys
          version = sys.argv[1]
          expected = {
              f"trestle_{version}_linux_amd64.tar.gz",
              f"trestle_{version}_linux_arm64.tar.gz",
              f"trestle_{version}_darwin_amd64.tar.gz",
              f"trestle_{version}_darwin_arm64.tar.gz",
              f"trestle_{version}_windows_amd64.zip",
              f"trestle_{version}_windows_arm64.zip",
          }
          seen = {}
          for line in open("SHA256SUMS"):
              line = line.rstrip("\n")
              parts = line.split("  ")
              if len(parts) != 2 or len(parts[0]) != 64 or not all(c in "0123456789abcdef" for c in parts[0]):
                  sys.exit(f"malformed checksum line: {line!r}")
              name = parts[1]
              if "/" in name or name.startswith(".") or ".." in name:
                  sys.exit(f"suspicious filename in SHA256SUMS: {name}")
              if name not in expected:
                  sys.exit(f"unexpected filename in SHA256SUMS: {name}")
              seen[name] = seen.get(name, 0) + 1
          for name in sorted(expected):
              if seen.get(name) != 1:
                  sys.exit(f"expected exactly one entry for {name}, found {seen.get(name, 0)}")
          print("SHA256SUMS: exactly six expected entries, no traversal or unexpected names")
          PY
          sha256sum -c SHA256SUMS

      - name: Constrained provenance verification (gh attestation verify)
        run: |
          set -euo pipefail
          cd artifacts
          for a in trestle_*; do
            echo "=== gh attestation verify: $a ==="
            gh attestation verify "$a" \
              --repo "${VERIFY_REPO}" \
              --signer-workflow "${VERIFY_REPO}/.github/workflows/release.yml" \
              --source-ref "refs/tags/${release}" \
              --source-digest "${commit}" \
              --deny-self-hosted-runners
            echo "=== $a: VERIFIED (repo, release.yml workflow, ${release}, ${commit}, hosted runners) ==="
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify release-body wording matches the release kind (read-only)
        run: |
          set -euo pipefail
          body=$(gh api "repos/${VERIFY_REPO}/releases/tags/${release}" --jq .body)
          case "${release#v}" in
            *-*)
              printf '%s' "$body" | grep -qi "preview / release candidate" \
                || { echo "prerelease body lacks release-candidate wording" >&2; exit 1; }
              printf '%s' "$body" | grep -qi "not a stable release" \
                || { echo "prerelease body must say it is not a stable release" >&2; exit 1; }
              echo "release body: honest prerelease wording confirmed (read-only)"
              ;;
            *)
              printf '%s' "$body" | grep -qi "stable public preview" \
                || { echo "stable body lacks stable-public-preview wording" >&2; exit 1; }
              if printf '%s' "$body" | grep -qi "release candidate"; then
                echo "stable body must not call itself a release candidate" >&2; exit 1
              fi
              if printf '%s' "$body" | grep -qi "not a stable release"; then
                echo "stable body must not say it is not a stable release" >&2; exit 1
              fi
              echo "release body: stable-public-preview wording confirmed (read-only)"
              ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
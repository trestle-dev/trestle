name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trestle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trestle_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TRESTLE_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/trestle_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Frontend checks
        run: |
          node --check internal/web/public/assets/js/script.js
          node scripts/check-web.mjs internal/web/public
      - name: Cross-build application
        shell: bash
        run: |
          set -eu
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /tmp/trestle-${GOOS}-${GOARCH} ./cmd/trestle
          done
      - name: Release packaging and installer syntax
        run: |
          sh -n install.sh update.sh scripts/package-release.sh scripts/test-release.sh scripts/test-installer.sh scripts/test-update.sh
          ./scripts/test-installer.sh
          ./scripts/test-update.sh
          ./scripts/test-release.sh
      - name: Real Caddy and nginx TLS smoke tests
        run: ./scripts/test-proxies.sh

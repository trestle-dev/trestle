name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PostgreSQL ${{ matrix.postgres }} suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trestle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trestle_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TRESTLE_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/trestle_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...

  gate:
    name: Format, vet, builds and proxy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Frontend checks
        run: |
          node --check internal/web/public/assets/js/script.js
          node scripts/check-web.mjs internal/web/public
      - name: Cross-build application
        shell: bash
        run: |
          set -eu

          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64
          do
            target_goos=${target%/*}
            target_goarch=${target#*/}

            suffix=
            if [ "$target_goos" = "windows" ]; then
              suffix=.exe
            fi

            GOOS="$target_goos" GOARCH="$target_goarch" \
              go build \
                -o "/tmp/trestle-${target_goos}-${target_goarch}${suffix}" \
                ./cmd/trestle
          done
      - name: Release packaging and installer syntax
        run: |
          sh -n install.sh download.sh update.sh scripts/checksum.sh scripts/package-release.sh scripts/test-release.sh scripts/test-release-reproducible.sh scripts/test-release-contract.sh scripts/test-installer.sh scripts/test-update.sh scripts/test-download.sh scripts/test-public-scripts.sh scripts/build-public-scripts.sh scripts/test-postgres-gate.sh scripts/test-connection-recovery.sh scripts/test-restore-drill.sh scripts/soak.sh scripts/test-parity-gate.sh scripts/test-subsystem-gate.sh
          ./scripts/test-installer.sh
          ./scripts/test-update.sh
          ./scripts/test-download.sh
          ./scripts/test-public-scripts.sh
          ./scripts/test-release.sh
          ./scripts/test-release-contract.sh
          ./scripts/test-release-reproducible.sh
      - name: Real Caddy and nginx TLS smoke tests
        run: ./scripts/test-proxies.sh